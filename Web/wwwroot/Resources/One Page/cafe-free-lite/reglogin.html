<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Café | Sign In / Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f9f5f0;
      color: #5a4a42;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-container {
      display: flex;
      max-width: 900px;
      width: 100%;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(90, 74, 66, 0.1);
    }

    .auth-image {
      flex: 1;
      background: url('https://preview.uideck.com/items/cafe/assets/images/hero/hero-image-2.png') center/cover no-repeat;
      min-height: 500px;
      display: none;
    }

    @media (min-width: 768px) {
      .auth-image {
        display: block;
      }
    }

    .auth-forms {
      flex: 1;
      padding: 50px 40px;
    }

    h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 28px;
      margin-bottom: 24px;
      color: #3a2f2b;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d9cfc7;
      border-radius: 10px;
      background-color: #fdf9f6;
      font-size: 15px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #b89e8a;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: #b89e8a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #a08570;
    }

    .switch-form {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .switch-form a {
      color: #b89e8a;
      text-decoration: none;
      font-weight: 500;
    }

    .switch-form a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-image"></div>
    <div class="auth-forms">
      <!-- Toggle between Login and Register -->
      <div id="login-form">
        <h2>Welcome Back</h2>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" />
        </div>
        <button class="btn">Sign In</button>
        <div class="switch-form">
          Don’t have an account? <a href="#" onclick="showRegister()">Sign Up</a>
        </div>
      </div>

      <div id="register-form" style="display: none;">
        <h2>Create Account</h2>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" />
        </div>
        <button class="btn">Sign Up</button>
        <div class="switch-form">
          Already have an account? <a href="#" onclick="showLogin()">Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function showRegister() {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('register-form').style.display = 'block';
    }

    function showLogin() {
      document.getElementById('register-form').style.display = 'none';
      document.getElementById('login-form').style.display = 'block';
    }
  </script>

</body>
</html>
